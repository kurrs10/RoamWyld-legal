<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're invited — Roam Wyld</title>
  <meta name="description" content="Someone has shared a trip with you on Roam Wyld." />
  <meta name="apple-itunes-app" content="app-id=6774633699" />
  <meta property="og:title" content="You've been invited to a trip" />
  <meta property="og:description" content="Open Roam Wyld to view and join your shared trip." />
  <meta property="og:image" content="https://roamwyld.app/ss-02.png" />
  <meta property="og:type" content="website" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #D97706;
      --primary-dark: #B45309;
      --hero: #1A1E26;
      --hero2: #252A34;
      --text: #F9FAFB;
      --text-muted: #94A3B8;
      --border: rgba(255,255,255,0.08);
    }
    html, body {
      min-height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--hero);
      color: var(--text);
    }
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px 60px;
      text-align: center;
    }
    .wordmark {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 4px;
      color: var(--primary);
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .wordmark img {
      width: 30px;
      height: 30px;
      border-radius: 7px;
    }
    .invite-label {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--primary);
      margin-bottom: 16px;
    }
    h1 {
      font-size: 32px;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 16px;
      max-width: 360px;
    }
    .subhead {
      font-size: 16px;
      color: var(--text-muted);
      line-height: 1.6;
      max-width: 320px;
      margin-bottom: 48px;
    }
    .card {
      background: var(--hero2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px 28px 32px;
      max-width: 360px;
      width: 100%;
      margin-bottom: 24px;
    }
    .card-icon {
      font-size: 40px;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .card-body {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
    }
    .btn-primary {
      display: block;
      width: 100%;
      max-width: 360px;
      background: var(--primary);
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      padding: 18px 24px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      margin-bottom: 14px;
      transition: background 0.15s;
    }
    .btn-primary:hover { background: var(--primary-dark); text-decoration: none; }

    .btn-store {
      display: inline-block;
      margin-top: 8px;
    }
    .btn-store img {
      height: 44px;
    }
    .divider {
      color: var(--text-muted);
      font-size: 13px;
      margin: 4px 0 16px;
    }
    .footer {
      margin-top: 48px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .footer a { color: var(--text-muted); text-decoration: underline; }

    #store-section { display: none; }
  </style>
</head>
<body>
<div class="page">
  <div class="wordmark">
    <img src="/icon.png" alt="" />
    ROAM WYLD
  </div>

  <p class="invite-label">Trip Invitation</p>
  <h1>You've been invited to a shared trip</h1>
  <p class="subhead">Your travel partner is using Roam Wyld to plan your trip together. Open the app to view the itinerary and join.</p>

  <a class="btn-primary" id="open-btn" href="#">Open in Roam Wyld</a>

  <div id="store-section">
    <p class="divider">— or download the app —</p>
    <a class="btn-store" href="https://apps.apple.com/app/id6774633699" target="_blank">
      <img src="https://developer.apple.com/assets/elements/badges/download-on-the-app-store.svg" alt="Download on the App Store" />
    </a>
  </div>

  <div class="footer">
    <a href="https://roamwyld.app">roamwyld.app</a> &nbsp;·&nbsp;
    <a href="https://roamwyld.app/privacy.html">Privacy</a>
  </div>
</div>

<script>
  // Read token from path (/invite/TOKEN) or query string (?token=TOKEN)
  var token = null;
  var pathParts = window.location.pathname.replace(/\/$/, '').split('/');
  var lastPart = pathParts[pathParts.length - 1];
  if (lastPart && lastPart !== 'invite' && lastPart !== 'index.html') {
    token = lastPart;
  }
  if (!token) {
    var params = new URLSearchParams(window.location.search);
    token = params.get('token');
  }

  var openBtn = document.getElementById('open-btn');
  var storeSection = document.getElementById('store-section');

  if (token) {
    var deepLink = 'voyagr://invite/' + token;
    openBtn.href = deepLink;
    openBtn.addEventListener('click', function(e) {
      e.preventDefault();
      window.location = deepLink;
      // Show App Store fallback after 2s in case app isn't installed
      setTimeout(function() {
        storeSection.style.display = 'block';
      }, 2000);
    });
  } else {
    // No token — show generic landing
    openBtn.textContent = 'Open Roam Wyld';
    openBtn.href = 'voyagr://';
    storeSection.style.display = 'block';
  }
</script>
</body>
</html>
